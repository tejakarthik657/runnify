# render.yaml — TerritoryRun deployment config for Render.com
# Defines: 1 web service (API) + 5 cron jobs
# Deploy by connecting your GitHub repo to Render and pointing to this file.

services:

  # ── Main API (Production) ─────────────────────────────────
  - type: web
    name: territory-run-api
    runtime: node
    plan: free                        # upgrade to Starter ($7/mo) at 500+ DAU
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false                   # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: FRONTEND_URL
        value: https://territoryrun.com
      - key: API_BASE_URL
        value: https://territory-run-api.onrender.com
      - key: PY_STATS_URL
        value: https://territory-run-py-stats.onrender.com
      - key: PY_HEX_URL
        value: https://territory-run-py-hex.onrender.com
      - key: PY_ENGAGEMENT_URL
        value: https://territory-run-py-engagement.onrender.com
      - key: PY_LEADERBOARD_URL
        value: https://territory-run-py-leaderboard.onrender.com
      - key: PY_TERRITORY_URL
        value: https://territory-run-py-territory.onrender.com
      - key: PY_ROUTES_URL
        value: https://territory-run-py-routes.onrender.com
      - key: PY_ELEVATION_URL
        value: https://territory-run-py-elevation.onrender.com
      - key: PY_HEATMAP_URL
        value: https://territory-run-py-heatmap.onrender.com
      - key: PY_BADGES_URL
        value: https://territory-run-py-badges.onrender.com
      - key: PY_CHALLENGES_URL
        value: https://territory-run-py-challenges.onrender.com
      - key: PY_NAMES_URL
        value: https://territory-run-py-names.onrender.com
      - key: PY_STREAK_URL
        value: https://territory-run-py-streak.onrender.com
      - key: PY_CREDITS_URL
        value: https://territory-run-py-credits.onrender.com

  # ── Staging API ────────────────────────────────────────────
  - type: web
    name: territory-run-api-staging
    runtime: node
    plan: free
    branch: develop
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: FRONTEND_URL
        value: https://staging.territoryrun.com

  # ── Cron: Decay (nightly 01:00 UTC) ───────────────────────
  - type: cron
    name: territory-run-decay
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm install
    schedule: "0 1 * * *"            # 01:00 UTC every day
    startCommand: npm run cron:decay
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false

  # ── Cron: Leaderboard (every 5 minutes) ───────────────────
  - type: cron
    name: territory-run-leaderboard
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm install
    schedule: "*/5 * * * *"          # every 5 minutes
    startCommand: npm run cron:leaderboard
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false

  # ── Cron: Blockchain Anchor (00:05 UTC daily) ─────────────
  - type: cron
    name: territory-run-blockchain
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm install
    schedule: "5 0 * * *"            # 00:05 UTC — after midnight rollover
    startCommand: npm run cron:blockchain
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: SOLANA_PRIVATE_KEY
        sync: false

  # ── Cron: RAG Ingest (02:00 UTC daily) ────────────────────
  - type: cron
    name: territory-run-rag-ingest
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm install
    schedule: "0 2 * * *"            # 02:00 UTC — after decay run
    startCommand: npm run cron:rag
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ── Python Microservices (FastAPI) ────────────────────────
  - type: web
    name: territory-run-py-stats
    runtime: python
    plan: free
    branch: main
    rootDir: backend/python-services
    buildCommand: pip install -r requirements.txt
    startCommand: cd 01-run-statistics && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

