name: Frontend CI/CD (All Branches)
on:
  pull_request:
    branches: [main, test, develop]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [main, test, develop]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: cd frontend && npm ci
      
      - name: Build frontend
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
      
      - name: Run linter
        run: cd frontend && npm run lint
        continue-on-error: true
      
      - name: Run E2E tests (main only)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: cd frontend && npx playwright test --reporter=html
        continue-on-error: true
  
  deploy-to-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        environment:
          - branch: main
            name: production
            prod: true
          - branch: test
            name: staging
            prod: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel (${{ matrix.environment.name }})
        if: github.ref == format('refs/heads/{0}', matrix.environment.branch)
        uses: vercel/action@main
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: frontend
          production: ${{ matrix.environment.prod }}
          comment: false
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      
      - name: Verify deployment (${{ matrix.environment.name }})
        if: github.ref == format('refs/heads/{0}', matrix.environment.branch)
        run: |
          echo "Frontend deployed to ${{ matrix.environment.name }}"
          sleep 10
  
  verify-health:
    name: Verify Health Check
    runs-on: ubuntu-latest
    needs: deploy-to-vercel
    if: github.event_name == 'push'
    
    steps:
      - name: Wait for deployment
        run: sleep 20
      
      - name: Check production health
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f https://api.territoryrun.onrender.com/health || exit 1
      
      - name: Check staging health
        if: github.ref == 'refs/heads/test'
        run: |
          curl -f https://api.territoryrun-api-staging.onrender.com/health || exit 1
