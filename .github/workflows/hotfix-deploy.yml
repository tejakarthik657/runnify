name: Hotfix Deploy (Production Only)
on:
  push:
    branches: [hotfix/*]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

concurrency:
  group: hotfix-deploy
  cancel-in-progress: false

jobs:
  emergency-test:
    name: Emergency Test (Hotfix Only)
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI_TEST }}
      JWT_SECRET: hotfix_test_secret
      JWT_REFRESH_SECRET: hotfix_test_refresh
      UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
      UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NODE_ENV: test
      PORT: 4000
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: cd backend && npm ci
      
      - name: Run critical tests only
        run: |
          cd backend
          npm test -- --testPathPattern="(auth|blockchain|anticheat)" --runInBand
      
      - name: Lint critical files
        run: cd backend && npx eslint auth-service/ blockchain-service/ --max-warnings 0
        continue-on-error: true
  
  deploy-production:
    name: Deploy Hotfix to Production
    runs-on: ubuntu-latest
    needs: emergency-test
    if: startsWith(github.ref, 'refs/heads/hotfix/')
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Deploy frontend to production
        uses: vercel/action@main
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: frontend
          production: true
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      
      - name: Deploy backend to production
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID_PROD }}?key=${{ secrets.RENDER_DEPLOY_KEY_PROD }}"
          echo "🚨 HOTFIX DEPLOYED TO PRODUCTION"
      
      - name: Health check with retries
        run: |
          max_attempts=15
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts..."
            if curl -f https://api.territoryrun.onrender.com/health; then
              echo "✅ HOTFIX VERIFIED - Backend is healthy"
              exit 0
            fi
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "❌ HOTFIX FAILED - Rolling back recommended"
          exit 1
      
      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            🚨 HOTFIX DEPLOYED
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
